<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Creamy - Mobile</title>
 
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#0F4A45;--pink:#1A766E;--pink2:#7FD1C0;--blush:#EEF8F5;--rose:#CFEBE4;--line:#CFE5E0;--muted:#357069;--mint:#D6EEF6;--mintink:#0A5873;--butter:#FFEBB0;--butterink:#7A5000}
body{margin:0;background:#F6FBF9}
*{box-sizing:border-box}
.app{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.app h1,.app h2,.app h3,.disp{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;margin:0}
:where(.app) button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.app button:focus-visible,.app a:focus-visible,.app input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
:where(.app) a{color:inherit}
.card.sel{border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)}
.chip.seg{background:transparent;border-color:transparent}
.chip.seg.on{background:var(--pink);color:#fff}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;background:var(--pink);color:#fff;font-weight:800;font-size:16px;text-align:center;text-decoration:none;width:100%}
.btn:disabled{background:var(--rose);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--rose);color:var(--ink)}
.btn.sm{min-height:44px;font-size:14px;padding:0 16px;width:auto}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.opt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;min-height:56px;padding:10px 12px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-weight:800}
.opt small{font-weight:600;font-size:12px;color:var(--muted)}
.opt.on{border-color:var(--pink);background:var(--blush);box-shadow:inset 0 0 0 1px var(--pink)}
.row-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-weight:700}
.row-opt.on{border-color:var(--pink);background:var(--blush);box-shadow:inset 0 0 0 1px var(--pink)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;background:#fff}
.on .radio{border:6px solid var(--pink)}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;background:#fff;display:flex;align-items:center;justify-content:center}
.on .check{background:var(--pink);border-color:var(--pink)}
.check svg{opacity:0}.on .check svg{opacity:1}
.tile{display:flex;align-items:center;justify-content:center;border-radius:20px}
.t0{background:#D2EDE6}.t1{background:#D8EDF5}.t2{background:#FFF1CF}.t3{background:#CFEBE4}
.bd{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:800;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.bdnew{background:var(--butter);color:var(--butterink)}
.bdhot{background:var(--pink);color:#fff}
.bdbest{background:var(--mint);color:var(--mintink)}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.navbtn svg{stroke:var(--muted)}
.navbtn.on{color:var(--pink)}
.navbtn.on svg{stroke:var(--pink)}
.promo{border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:168px;justify-content:flex-end}
.p0{background:linear-gradient(135deg,#A9E4DA,#8DCFE3);color:#0F3A36}
.p1{background:linear-gradient(135deg,#DDF3EE,#BFE6EA);color:#0F4A45}
.p2{background:linear-gradient(135deg,#D8EDF5,#B4DDEE);color:#0A4A63}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);padding:0}
.dot.on{width:22px;border-radius:99px;background:var(--pink)}
.card{border:1.5px solid var(--line);border-radius:20px;background:#fff}
.stp{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.done .stp{background:var(--pink);border-color:var(--pink)}
.now .stp{border-color:var(--pink);box-shadow:0 0 0 5px var(--rose)}
.next{color:var(--muted)}
.field{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);padding:0 16px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
.field::placeholder{color:#5F8F89}
.step{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff;flex:none}
.link{color:var(--pink);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.star{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:14px;flex:none}
.star svg{fill:none;stroke:var(--pink);stroke-width:1.8;stroke-linejoin:round}
.star.on svg{fill:#F5B800;stroke:#C98A00}
textarea.field{padding:12px 16px;min-height:104px;resize:none;line-height:1.4}
.ph{width:76px;height:76px;border-radius:16px;position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--ink)}
.ph0{background:#BFE6EA}.ph1{background:#FFE9A8}.ph2{background:#CFEBE4}
.phx{position:absolute;top:-14px;right:-14px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.phx span{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;line-height:1}
.msg{padding:10px 14px;border-radius:14px;background:var(--butter);color:var(--butterink);font-weight:700;font-size:14px;line-height:1.4}
.bell{position:relative;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;border:1.5px solid var(--line)}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #F6FBF9}
.card.unread{background:var(--blush);border-color:var(--pink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.swbtn{width:56px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.swtrack{width:52px;height:32px;border-radius:99px;background:#9DBDB8;position:relative;transition:background .15s}
.swknob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.swbtn.on .swtrack{background:var(--pink)}
.swbtn.on .swknob{left:23px}
@media (prefers-reduced-motion:reduce){.swtrack,.swknob{transition:none}}
</style>
 
<style>
html,body{min-height:100%}
body{display:flex;justify-content:center;align-items:flex-start;padding:24px 0}
#root .app{border-radius:28px;box-shadow:0 20px 60px rgba(15,74,69,.18);border:1px solid var(--line)}
@media (max-width:430px){
  body{padding:0;display:block}
  #root .app{width:100vw !important;height:100vh !important;height:100dvh !important;border-radius:0;box-shadow:none;border:0}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/template" id="tpl">
 
 
<div class="app" style="position:relative;width:390px;height:844px;overflow:hidden;background:#F6FBF9;display:flex;flex-direction:column">
 
<!-- ============ SIGN IN ============ -->
<sc-if value="{{showAuth}}" hint-placeholder-val="{{ false }}">
<div class="noscroll" style="position:absolute;inset:0;z-index:30;background:#F6FBF9;overflow-y:auto;padding:36px 24px 28px;display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px">
    <div class="tile t0" style="width:112px;height:112px;border-radius:50%">
      <svg viewBox="0 0 80 80" width="88" height="88" aria-hidden="true">
        <circle cx="40" cy="32" r="16" fill="#7FD1C0"/>
        <path d="M26 42 L54 42 L40 76 Z" fill="#E9B56F" stroke="#1A766E" stroke-width="2"/>
        <circle cx="34" cy="28" r="3" fill="#fff" opacity=".7"/>
      </svg>
    </div>
    <h1 style="font-size:34px;color:var(--pink)">Happy Creamy</h1>
    <p style="margin:0;text-align:center;color:var(--muted);font-weight:600">Sign in to start scooping.</p>
  </div>
 
  <sc-if value="{{authForm}}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;flex-direction:column;gap:12px">
    <button type="button" class="btn ghost" onClick="{{socialSignIn}}">
      <span style="width:24px;height:24px;border-radius:50%;background:var(--rose);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800">G</span>
      Continue with Google
    </button>
    <button type="button" class="btn ghost" onClick="{{socialSignIn}}">
      <span style="width:24px;height:24px;border-radius:50%;background:var(--rose);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800">f</span>
      Continue with Facebook
    </button>
  </div>
  <div style="display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:700;font-size:13px">
    <div style="flex:1;height:1px;background:var(--line)"></div>or use email<div style="flex:1;height:1px;background:var(--line)"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="email" style="font-weight:800;font-size:14px">Email</label>
      <input id="email" class="field" type="email" placeholder="you@example.com" value="{{email}}" onChange="{{setEmail}}">
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="pw" style="font-weight:800;font-size:14px">Password</label>
      <input id="pw" class="field" type="password" placeholder="At least 8 characters">
    </div>
    <button type="button" class="btn" onClick="{{submitAuth}}">{{authCta}}</button>
    <button type="button" class="link" style="text-align:center;min-height:44px" onClick="{{toggleAuth}}">{{authSwitch}}</button>
  </div>
  </sc-if>
 
  <sc-if value="{{authOtp}}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:14px;padding-top:8px">
    <h2 style="font-size:24px">Check your email</h2>
    <p style="margin:0;color:var(--muted);font-weight:600;line-height:1.5">We sent a 6-digit code to <b style="color:var(--ink)">{{emailShown}}</b>. Enter it to finish creating your account.</p>
    <label for="otp" style="font-weight:800;font-size:14px">Verification code</label>
    <input id="otp" class="field" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:.5em;font-size:24px;text-align:center;font-weight:800" value="{{otp}}" onChange="{{setOtp}}">
    <button type="button" class="btn" disabled="{{otpBlocked}}" onClick="{{verifyOtp}}">Verify and sign in</button>
    <p style="margin:0;color:var(--muted);font-size:13px;font-weight:600;text-align:center">Demo: type any 6 digits.</p>
  </div>
  </sc-if>
</div>
</sc-if>
 
<!-- ============ MAIN APP ============ -->
<div class="noscroll" style="flex:1;min-height:0;overflow-y:auto;position:relative">
 
  <!-- HOME -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
  <div style="padding:22px 20px 28px;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <h1 style="font-size:26px;color:var(--pink)">Happy Creamy</h1>
        <div style="font-weight:700;color:var(--muted);font-size:14px">Hi, Nhung! What are we scooping today?</div>
      </div>
      <button type="button" class="bell" aria-label="{{bellAria}}" onClick="{{openNotifs}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F4A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ false }}"><span class="badge" aria-hidden="true">{{unreadLabel}}</span></sc-if>
      </button>
    </div>
 
    <div>
      <div class="promo {{slide.cls}}">
        <span class="bd bdnew" style="align-self:flex-start">{{slide.tag}}</span>
        <h2 style="font-size:26px;line-height:1.1">{{slide.title}}</h2>
        <div style="font-weight:700;font-size:14px;opacity:.9">{{slide.sub}}</div>
      </div>
      <div style="display:flex;justify-content:center;gap:4px;margin-top:6px">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
          <button type="button" class="dot {{d.cls}}" aria-label="{{d.aria}}" onClick="{{d.pick}}" style="min-width:8px;margin:0 3px"></button>
        </sc-for>
      </div>
      <button type="button" class="btn" style="margin-top:14px" onClick="{{goOrderNow}}">Order now</button>
    </div>
 
    <div>
      <h3 style="font-size:19px;margin-bottom:12px">Quick picks</h3>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
          <button type="button" onClick="{{q.pick}}" style="display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px;text-align:center">
            <span class="tile {{q.t}}" style="width:68px;height:68px;border-radius:50%">
              <svg viewBox="0 0 80 80" width="48" height="48" aria-hidden="true">
                <circle cx="{{q.a.s1x}}" cy="{{q.a.s1y}}" r="{{q.a.s1r}}" fill="{{q.a.s1c}}"/>
                <circle cx="{{q.a.s2x}}" cy="{{q.a.s2y}}" r="{{q.a.s2r}}" fill="{{q.a.s2c}}"/>
                <path d="{{q.a.base}}" fill="{{q.a.baseFill}}" stroke="#1A766E" stroke-width="2"/>
                <path d="{{q.a.top}}" fill="{{q.a.topFill}}" stroke="#1A766E" stroke-width="2"/>
              </svg>
            </span>
            <span style="font-weight:800;font-size:12px;line-height:1.15">{{q.label}}</span>
          </button>
        </sc-for>
      </div>
    </div>
 
    <div style="display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--mint);color:var(--mintink);font-weight:700;font-size:13.5px;line-height:1.35">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A5873" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
      <span>We deliver up to 10 km from our shops, during opening hours. Pick-up is always free.</span>
    </div>
 
    <div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">
        <h3 style="font-size:19px">Best-sellers</h3>
        <button type="button" class="link" style="min-height:44px;font-size:14px" onClick="{{goBest}}">See all</button>
      </div>
      <div class="noscroll" style="display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px">
        <sc-for list="{{bestsellers}}" as="p" hint-placeholder-count="3">
          <button type="button" class="card" onClick="{{p.open}}" style="flex:none;width:150px;padding:10px;display:flex;flex-direction:column;gap:8px">
            <span class="tile {{p.t}}" style="height:100px">
              <svg viewBox="0 0 80 80" width="72" height="72" aria-hidden="true">
                <circle cx="{{p.a.s1x}}" cy="{{p.a.s1y}}" r="{{p.a.s1r}}" fill="{{p.a.s1c}}"/>
                <circle cx="{{p.a.s2x}}" cy="{{p.a.s2y}}" r="{{p.a.s2r}}" fill="{{p.a.s2c}}"/>
                <path d="{{p.a.base}}" fill="{{p.a.baseFill}}" stroke="#1A766E" stroke-width="2"/>
                <path d="{{p.a.top}}" fill="{{p.a.topFill}}" stroke="#1A766E" stroke-width="2"/>
              </svg>
            </span>
            <span style="font-weight:800;font-size:14px;line-height:1.2">{{p.name}}</span>
            <span style="font-weight:700;font-size:13px;color:var(--muted)">{{p.priceLabel}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>
  </sc-if>
 
  <!-- MENU -->
  <sc-if value="{{isMenu}}" hint-placeholder-val="{{ false }}">
  <div style="padding:22px 20px 110px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h1 style="font-size:28px">Menu</h1><button type="button" class="bell" aria-label="{{bellAria}}" onClick="{{openNotifs}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F4A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ false }}"><span class="badge" aria-hidden="true">{{unreadLabel}}</span></sc-if>
      </button></div>
    <div class="noscroll" style="display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
        <button type="button" class="chip {{c.cls}}" onClick="{{c.pick}}">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <sc-for list="{{products}}" as="p" hint-placeholder-count="6">
        <div class="card" style="padding:10px;display:flex;flex-direction:column;gap:8px;position:relative">
          <button type="button" class="tile {{p.t}}" onClick="{{p.open}}" aria-label="{{p.aria}}" style="height:112px;width:100%;justify-content:center">
            <svg viewBox="0 0 80 80" width="82" height="82" aria-hidden="true">
              <circle cx="{{p.a.s1x}}" cy="{{p.a.s1y}}" r="{{p.a.s1r}}" fill="{{p.a.s1c}}"/>
              <circle cx="{{p.a.s2x}}" cy="{{p.a.s2y}}" r="{{p.a.s2r}}" fill="{{p.a.s2c}}"/>
              <path d="{{p.a.base}}" fill="{{p.a.baseFill}}" stroke="#1A766E" stroke-width="2"/>
              <path d="{{p.a.top}}" fill="{{p.a.topFill}}" stroke="#1A766E" stroke-width="2"/>
            </svg>
          </button>
          <sc-if value="{{p.badge}}" hint-placeholder-val="{{ true }}">
            <span class="bd {{p.badgeCls}}" style="position:absolute;top:16px;left:16px">{{p.badge}}</span>
          </sc-if>
          <div style="font-weight:800;font-size:14px;line-height:1.2;min-height:34px">{{p.name}}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
            <span style="font-weight:700;font-size:13px;color:var(--muted)">{{p.priceLabel}}</span>
            <button type="button" aria-label="{{p.aria}}" onClick="{{p.open}}" style="width:44px;height:44px;margin:-6px -6px -6px 0;display:flex;align-items:center;justify-content:center">
              <span style="width:32px;height:32px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </span>
            </button>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  </sc-if>
 
  <!-- STORES -->
  <sc-if value="{{isStores}}" hint-placeholder-val="{{ false }}">
  <div style="padding:22px 20px 28px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h1 style="font-size:28px">Stores</h1><button type="button" class="bell" aria-label="{{bellAria}}" onClick="{{openNotifs}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F4A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ false }}"><span class="badge" aria-hidden="true">{{unreadLabel}}</span></sc-if>
      </button></div>
    <div style="border-radius:24px;overflow:hidden;border:1.5px solid var(--line);background:#F5FAF8">
      <svg viewBox="0 0 350 210" width="100%" role="img" aria-label="Map showing three Happy Creamy shops near you" style="display:block">
        <rect width="350" height="210" fill="#F5FAF8"/>
        <path d="M-10 150 C80 120 140 170 230 110 S330 70 370 60" stroke="#CFEBE4" stroke-width="18" fill="none"/>
        <path d="M60 -10 L90 220" stroke="#E3F2EE" stroke-width="12"/>
        <path d="M200 -10 L170 220" stroke="#E3F2EE" stroke-width="12"/>

      showPush: !!pushN, push: pushN ? { title: pushN.title, msg: pushN.msg } : { title: '', msg: '' }, openPush: () => pushN && this.openNotif(pushN),
 
      nav, showNav: !overlay,
      goHome: set({ tab: 'home' }), goMenu: set({ tab: 'menu' }), goStores: set({ tab: 'stores' }), goAccount: set({ tab: 'account' }),
 
      isHome: s.tab === 'home', isMenu: s.tab === 'menu', isStores: s.tab === 'stores', isAccount: s.tab === 'account',
      slide: sl, dots, quick, bestsellers,
      goOrderNow: set({ tab: 'menu', cat: 'all' }), goBest: set({ tab: 'menu', cat: 'best' }),
 
      cats, products,
      branches, pins,
 
      emailShown2: emailShown,
      tabActiveCls: s.ordersTab === 'active' ? 'on' : '', tabHistCls: s.ordersTab === 'history' ? 'on' : '',
      showActive: set({ ordersTab: 'active' }), showHistory: set({ ordersTab: 'history' }),
      showActiveList: s.ordersTab === 'active', showHistoryList: s.ordersTab === 'history',
      hasActive, noActive: !hasActive, placed: placed || { id: '', totalLabel: '', typeLabel: '', count: 0, payLabel: '', where: '' },
      statusLabel, history, settings,
      openTracking: set({ view: 'tracking' }),
 
      showCartBar: s.tab === 'menu' && s.cart.length > 0 && !overlay,
      cartCount, subtotalLabel: fmt(tot.items),
      openCheckout: set({ view: 'checkout' }),
 
      showSheet: !!s.product, sheet, sizeOpts: sizeOptsOut, drizzles: DRIZZLE.map(topOf), crunchy: CRUNCH.map(topOf),
      note: s.note, noteCount: s.note.length, setNote: (e) => this.setState({ note: e.target.value.slice(0, 100) }),
      qty: s.qty, qtyUp: () => this.setState({ qty: s.qty + 1 }), qtyDown: () => this.setState({ qty: Math.max(1, s.qty - 1) }),
      sheetTotal: fmt(unit * s.qty),
      closeSheet: set({ product: null }),
      addToCart: () => {
        const names = [...DRIZZLE, ...CRUNCH].filter((t) => s.tops[t.id]).map((t) => t.label);
        const sz = isBev ? '' : isTub ? (s.size === 't1' ? '1 litre' : '400 ml') : 'Size ' + s.size;
        const detail = [sz, ...names, s.note ? '“' + s.note + '”' : ''].filter(Boolean).join(' · ') || 'Regular';
        const line = { uid: s.uid, pid: prod.id, kind: prod.kind, name: prod.name, detail, unit, qty: s.qty };
        this.setState({ cart: [...s.cart, line], uid: s.uid + 1, product: null });
        this.showToast('Added to cart');
      },
 
      showCheckout: s.view === 'checkout', cartEmpty: s.cart.length === 0, cartFilled: s.cart.length > 0, lines,
      closeCheckout: set({ view: 'app' }),
      isDelivery: del, isPickup: !del,
      deliveryCls: del ? 'on' : '', pickupCls: del ? '' : 'on',
      setDelivery: set({ orderType: 'delivery' }), setPickup: set({ orderType: 'pickup' }),
      addrs, branchOpts, slots, payOpts,
      hasPack: tot.pack > 0, packLabel: fmt(tot.pack), packWhy: tot.packWhy,
      feeTitle: del ? 'Delivery fee' : 'Delivery fee (pick-up)', feeLabel: fmt(tot.fee),
      totalLabel: fmt(tot.total), sumLine,
      hasBlock: !!tot.block, blockMsg: tot.block,
      placeBlocked: blocked, placeLabel: blocked && tot.block ? 'Can’t place this order yet' : 'Place order · ' + fmt(tot.total),
      placeOrder: () => {
        if (blocked) return;
        const b = BRANCHES.find((x) => x.id === s.branch);
        const a = ADDRS.find((x) => x.id === s.addr);
        const pay = PAYS.find((x) => x.id === s.pay);
        const p = {
          id: 'HC-' + (2048 + s.uid), type: s.orderType, totalLabel: fmt(tot.total), count: cartCount,
          typeLabel: del ? 'Delivery' : 'Pick-up', payLabel: pay.label,
          where: del ? 'To ' + a.name + ', ' + a.line : b.name + ' at ' + s.slot, online: s.pay !== 'cod', payId: s.pay
        };
        const patch = { placed: p, view: 'tracking', cart: [], orderStep: p.online ? -1 : 0, countdown: 600 };
        if (p.online) this.setState(patch); else this.notify(patch, statusNotif(0, p));
      },
 
      showTracking: s.view === 'tracking' && !!placed,
      awaitingPay: s.orderStep === -1, cancelled: s.orderStep === -2, trackable: s.orderStep >= 0,
      countdownLabel: mm + ':' + ss,
      payTitle: s.placed && s.placed.payId === 'qr' ? 'Scan to pay with your banking app' : s.placed && s.placed.payId === 'momo' ? 'Scan with MoMo to pay' : 'Finish paying by card (VNPay)',
      etaLine: placed ? (placed.type === 'delivery' ? 'Estimated delivery in 25 to 35 minutes' : 'Ready at ' + (placed.where.split(' at ')[1] || '')) : '',
      timeline,
      advanceLabel: s.orderStep >= 3 ? 'Order complete' : 'Demo: next status',
      advance: () => {
        // Every status change adds a bell item; Completed adds only the feedback request.
        if (s.orderStep === -1) this.notify({ orderStep: 0 }, statusNotif(0, placed));
        else if (s.orderStep === 2) this.notify({ orderStep: 3 }, feedbackNotif(placed));
        else if (s.orderStep >= 0 && s.orderStep < 3) this.notify({ orderStep: s.orderStep + 1 }, statusNotif(s.orderStep + 1, placed));
      },
      leaveTracking: set({ view: 'app', tab: 'menu' }),
 
      showFeedback: s.view === 'feedback' && !!s.fb,
      fb: { id: fb.id, typeLabel: fb.type === 'pickup' ? 'Pick-up' : 'Delivery' },
      stars, ratingLabel: fb.rating ? STAR_LABELS[fb.rating - 1] : 'Tap a star to rate', noRating: fb.rating === 0,
      hasOptions: fbOpts.length > 0, fbOpts,
      comment: fb.comment, commentCount: fb.comment.length, setComment: (e) => this.patchFb({ comment: e.target.value.slice(0, 500) }),
      photos, photoCount: fb.photos.length, hasPhotoErr: !!fb.err, photoErr: fb.err,
      addPhoto: () => {
        if (fb.photos.length >= 3) this.patchFb({ err: 'You can add up to 3 photos.' });
        else this.patchFb({ photos: [...fb.photos, { n: fb.pn + 1 }], pn: fb.pn + 1, err: '' });
      },
      addBigPhoto: () => this.patchFb({ err: 'This photo is larger than 5 MB. Choose a smaller one.' }),
      closeFeedback: set({ view: s.fb && s.fb.from === 'tracking' ? 'tracking' : 'app', fb: null }),
      sendFeedback: () => {
        if (fb.rating === 0) return;
        this.setState({ sent: { ...s.sent, [fb.id]: true }, view: fb.from === 'tracking' ? 'tracking' : 'app', fb: null });
        this.showToast('Thanks! Your feedback has been sent.');
      },
      showRateCard: s.orderStep === 3 && !!placed && !s.sent[placed.id],
      showSentCard: s.orderStep === 3 && !!placed && !!s.sent[placed.id],
      rateFromTracking: () => this.openFeedback(placed.id, placed.type, 'tracking'),
 
      hasToast: !!s.toast, toast: s.toast
    };
  }
 
  statusText() {
    const s = this.state;
    if (s.orderStep === -1) return 'Awaiting payment';
    const p = s.placed;
    const labels = p.type === 'pickup' ? ['Received', 'Preparing', 'Ready for pick-up', 'Completed'] : ['Received', 'Preparing', 'Out for delivery', 'Completed'];
    return labels[Math.max(0, s.orderStep)];
  }
}
 
return Component;
})();
mountDC(Component, document.getElementById('tpl').textContent, document.getElementById('root'));
</script>
