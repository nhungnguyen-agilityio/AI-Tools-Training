<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Creamy - Desktop</title>
 
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#0F4A45;--pink:#1A766E;--pink2:#7FD1C0;--blush:#EEF8F5;--rose:#CFEBE4;--line:#CFE5E0;--muted:#357069;--mint:#D6EEF6;--mintink:#0A5873;--butter:#FFEBB0;--butterink:#7A5000}
body{margin:0;background:#F6FBF9}
*{box-sizing:border-box}
.app{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.app h1,.app h2,.app h3,.disp{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;margin:0}
:where(.app) button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.app button:focus-visible,.app a:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
:where(.app) a{color:inherit}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--pink);color:#fff;font-weight:800;font-size:16px;text-align:center;width:100%}
.chip:disabled{opacity:.5;cursor:not-allowed}
.btn:disabled{background:var(--rose);color:var(--muted);cursor:not-allowed}
.btn.sm{min-height:44px;font-size:14px;padding:0 18px;width:auto}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chip:hover{border-color:var(--pink)}
.chip.seg{background:transparent;border-color:transparent}
.chip.seg.on{background:var(--pink);color:#fff}
.nav{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent}
.nav.on{color:var(--pink);border-bottom-color:var(--pink)}
.card{border:1.5px solid var(--line);border-radius:22px;background:#fff}
.card.sel{border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
a.btn{text-decoration:none;color:#fff}
.field{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);padding:0 16px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
.field::placeholder{color:#5F8F89}
.field:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.link{color:var(--pink);font-weight:800;text-decoration:underline;text-underline-offset:3px}
a.btn.ghost{color:var(--ink)}
.tile{display:flex;align-items:center;justify-content:center;border-radius:18px}
.t0{background:#D2EDE6}.t1{background:#D8EDF5}.t2{background:#FFF1CF}.t3{background:#CFEBE4}
.bd{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:800;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.bdnew{background:var(--butter);color:var(--butterink)}
.bdhot{background:var(--pink);color:#fff}
.bdbest{background:var(--mint);color:var(--mintink)}
.row-opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.row-opt.on{border-color:var(--pink);background:var(--blush);box-shadow:inset 0 0 0 1px var(--pink)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;background:#fff}
.on .radio{border:5px solid var(--pink)}
.step{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff;flex:none}
.pcard{transition:transform .15s ease,box-shadow .15s ease}
.pcard:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(26,118,110,.12)}
@media (prefers-reduced-motion:reduce){.pcard{transition:none}.pcard:hover{transform:none}}
.star{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:none}
.star svg{fill:none;stroke:var(--pink);stroke-width:1.8;stroke-linejoin:round}
.star.on svg{fill:#F5B800;stroke:#C98A00}
.star:hover svg{stroke:#0F4A45}
textarea.field{padding:12px 16px;min-height:104px;resize:none;line-height:1.4}
.ph{width:76px;height:76px;border-radius:16px;position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--ink)}
.ph0{background:#BFE6EA}.ph1{background:#FFE9A8}.ph2{background:#CFEBE4}
.phx{position:absolute;top:-14px;right:-14px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.phx span{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;line-height:1}
.msg{padding:10px 14px;border-radius:14px;background:var(--butter);color:var(--butterink);font-weight:700;font-size:14px;line-height:1.4}
.bell{position:relative;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;border:1.5px solid var(--line)}
.bell:hover{border-color:var(--pink)}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #F6FBF9}
.card.unread{background:var(--blush);border-color:var(--pink2)}
.nitem{width:100%;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;border-radius:16px}
.nitem:hover{border-color:var(--pink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.swbtn{width:56px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.swtrack{width:52px;height:32px;border-radius:99px;background:#9DBDB8;position:relative;transition:background .15s}
.swknob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.swbtn.on .swtrack{background:var(--pink)}
.swbtn.on .swknob{left:23px}
@media (prefers-reduced-motion:reduce){.swtrack,.swknob{transition:none}}
</style>
 
<style>
#root .app{min-height:100vh !important}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/template" id="tpl">
 
 
<div class="app" style="min-height:1560px;background:#F6FBF9;position:relative">
 
  <sc-if value="{{showAuth}}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:0;z-index:50;background:#F6FBF9;display:flex;flex-wrap:wrap;min-height:760px">
    <div style="flex:1 1 440px;min-width:0;background:linear-gradient(150deg,#A9E4DA,#8DCFE3);color:#0F3A36;padding:64px 56px;display:flex;flex-direction:column;justify-content:center;gap:20px;align-items:flex-start">
      <svg viewBox="0 0 80 80" width="180" height="180" aria-hidden="true">
        <circle cx="40" cy="30" r="17" fill="#fff" opacity=".9"/><circle cx="34" cy="26" r="3.5" fill="#7FD1C0"/>
        <path d="M25 41 L55 41 L40 77 Z" fill="#E9B56F" stroke="#0F3A36" stroke-width="2"/>
      </svg>
      <h1 style="font-size:52px;line-height:1.05">Cold, creamy, and on its way.</h1>
      <p style="margin:0;font-weight:700;font-size:18px;max-width:420px">Sign in to order scoops, tubs and shakes for delivery within 10 km, or pick up at your nearest Happy Creamy.</p>
    </div>
    <div style="flex:1 1 440px;min-width:0;display:flex;align-items:center;justify-content:center;padding:48px 32px">
      <div style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px">
        <div class="disp" style="font-size:28px;color:var(--pink)">Happy Creamy</div>
 
        <sc-if value="{{authForm}}" hint-placeholder-val="{{ true }}">
          <h2 style="font-size:30px">{{authTitle}}</h2>
          <div style="display:flex;flex-direction:column;gap:10px">
            <button type="button" class="btn ghost" onClick="{{socialSignIn}}"><span style="width:24px;height:24px;border-radius:50%;background:var(--rose);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800">G</span>Continue with Google</button>
            <button type="button" class="btn ghost" onClick="{{socialSignIn}}"><span style="width:24px;height:24px;border-radius:50%;background:var(--rose);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800">f</span>Continue with Facebook</button>
          </div>
          <div style="display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:700;font-size:13px"><div style="flex:1;height:1px;background:var(--line)"></div>or use email<div style="flex:1;height:1px;background:var(--line)"></div></div>
          <sc-if value="{{isRegister}}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:6px"><label for="name" style="font-weight:800;font-size:14px">Your name</label><input id="name" class="field" placeholder="Nhung Nguyen"></div>
          </sc-if>
          <div style="display:flex;flex-direction:column;gap:6px"><label for="email" style="font-weight:800;font-size:14px">Email</label><input id="email" class="field" type="email" placeholder="you@example.com" value="{{email}}" onChange="{{setEmail}}"></div>
          <div style="display:flex;flex-direction:column;gap:6px"><label for="pw" style="font-weight:800;font-size:14px">Password</label><input id="pw" class="field" type="password" placeholder="At least 8 characters" value="{{pw}}" onChange="{{setPw}}"></div>
          <sc-if value="{{hasAuthErr}}" hint-placeholder-val="{{ false }}"><div role="alert" style="padding:12px 14px;border-radius:14px;background:var(--butter);color:var(--butterink);font-weight:700;font-size:14px;line-height:1.4">{{authErr}}</div></sc-if>
          <sc-if value="{{hasAuthNote}}" hint-placeholder-val="{{ false }}"><p data-note style="margin:0;color:var(--muted);font-weight:700;font-size:14px;line-height:1.4">{{authNote}}</p></sc-if>
          <button type="button" class="btn" onClick="{{submitAuth}}">{{authCta}}</button>
          <sc-if value="{{showForgot}}" hint-placeholder-val="{{ true }}"><button type="button" class="link" style="text-align:center;min-height:44px" onClick="{{openForgot}}">Forgot password?</button></sc-if>
          <button type="button" class="link" style="text-align:center;min-height:44px" onClick="{{toggleAuth}}">{{authSwitch}}</button>
        </sc-if>
 
        <sc-if value="{{authOtp}}" hint-placeholder-val="{{ false }}">
          <h2 style="font-size:30px">Check your email</h2>
          <p style="margin:0;color:var(--muted);font-weight:600;line-height:1.5">We sent a 6-digit code to <b style="color:var(--ink)">{{emailShown}}</b>. Enter it to finish creating your account.</p>
          <label for="otp" style="font-weight:800;font-size:14px">Verification code</label>
          <input id="otp" class="field" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:.5em;font-size:24px;text-align:center;font-weight:800" value="{{otp}}" onChange="{{setOtp}}">
          <button type="button" class="btn" disabled="{{otpBlocked}}" onClick="{{verifyOtp}}">Verify and sign in</button>
          <sc-if value="{{hasAuthErr}}" hint-placeholder-val="{{ false }}"><div role="alert" style="padding:12px 14px;border-radius:14px;background:var(--butter);color:var(--butterink);font-weight:700;font-size:14px;line-height:1.4">{{authErr}}</div></sc-if>
          <sc-if value="{{hasAuthNote}}" hint-placeholder-val="{{ false }}"><p data-note style="margin:0;color:var(--muted);font-weight:700;font-size:14px;line-height:1.4">{{authNote}}</p></sc-if>
          <button type="button" class="link" style="text-align:center;min-height:44px" onClick="{{resendOtp}}">Send a new code</button>
          <p style="margin:0;color:var(--muted);font-size:13px;font-weight:600;text-align:center">Demo: the code is 123456.</p>
        </sc-if>

        <sc-if value="{{authForgot}}" hint-placeholder-val="{{ false }}">
          <h2 style="font-size:30px">Reset your password</h2>
          <p style="margin:0;color:var(--muted);font-weight:600;line-height:1.5">Enter your email and we will send you a 6-digit code.</p>
          <label for="email" style="font-weight:800;font-size:14px">Email</label>
          <input id="email" class="field" type="email" placeholder="you@example.com" value="{{email}}" onChange="{{setEmail}}">
          <sc-if value="{{hasAuthErr}}" hint-placeholder-val="{{ false }}"><div role="alert" style="padding:12px 14px;border-radius:14px;background:var(--butter);color:var(--butterink);font-weight:700;font-size:14px;line-height:1.4">{{authErr}}</div></sc-if>
          <button type="button" class="btn" onClick="{{sendReset}}">Send reset code</button>
          <button type="button" class="link" style="text-align:center;min-height:44px" onClick="{{backToLogin}}">Back to log in</button>
        </sc-if>

        <sc-if value="{{authReset}}" hint-placeholder-val="{{ false }}">
          <h2 style="font-size:30px">Enter your reset code</h2>
          <sc-if value="{{hasAuthNote}}" hint-placeholder-val="{{ false }}"><p data-note style="margin:0;color:var(--muted);font-weight:700;font-size:14px;line-height:1.4">{{authNote}}</p></sc-if>
          <label for="rcode" style="font-weight:800;font-size:14px">Reset code</label>
          <input id="rcode" class="field" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:.5em;font-size:24px;text-align:center;font-weight:800" value="{{rcode}}" onChange="{{setRcode}}">
          <label for="npw" style="font-weight:800;font-size:14px">New password</label>
          <input id="npw" class="field" type="password" placeholder="At least 8 characters" value="{{npw}}" onChange="{{setNpw}}">
          <sc-if value="{{hasAuthErr}}" hint-placeholder-val="{{ false }}"><div role="alert" style="padding:12px 14px;border-radius:14px;background:var(--butter);color:var(--butterink);font-weight:700;font-size:14px;line-height:1.4">{{authErr}}</div></sc-if>
          <button type="button" class="btn" onClick="{{doReset}}">Reset password</button>
          <button type="button" class="link" style="text-align:center;min-height:44px" onClick="{{sendReset}}">Send a new code</button>
          <button type="button" class="link" style="text-align:center;min-height:44px" onClick="{{backToLogin}}">Back to log in</button>
          <p data-demo-code style="margin:0;color:var(--muted);font-size:13px;font-weight:600;text-align:center">Demo: the code is {{demoCode}}.</p>
        </sc-if>
      </div>
    </div>
  </div>
  </sc-if>
 
 
  <header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;padding:14px 48px;border-bottom:1.5px solid var(--line)">
    <div style="display:flex;align-items:center;gap:10px">
      <svg viewBox="0 0 80 80" width="40" height="40" aria-hidden="true"><circle cx="40" cy="32" r="16" fill="#7FD1C0"/><path d="M26 42 L54 42 L40 76 Z" fill="#E9B56F" stroke="#1A766E" stroke-width="2"/></svg>
      <span class="disp" style="font-size:26px;color:var(--pink)">Happy Creamy</span>
    </div>
    <nav aria-label="Main" style="display:flex;gap:26px;flex-wrap:wrap">
      <button type="button" class="nav {{nav.home}}" onClick="{{goHome}}">Home</button>
      <button type="button" class="nav {{nav.menu}}" onClick="{{goMenu}}">Menu</button>
      <button type="button" class="nav {{nav.stores}}" onClick="{{goStores}}">Stores</button>
      <button type="button" class="nav {{nav.account}}" onClick="{{goAccount}}">Account</button>
    </nav>
    <div style="display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px">
      <button type="button" class="bell" aria-label="{{bellAria}}" aria-haspopup="dialog" aria-expanded="{{bellExp}}" onClick="{{toggleNotifs}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F4A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ false }}"><span class="badge" aria-hidden="true">{{unreadLabel}}</span></sc-if>
      </button>
      <span style="width:36px;height:36px;border-radius:50%;background:var(--rose);display:flex;align-items:center;justify-content:center;font-family:Fredoka">N</span>Nhung
      <span class="bd bdbest" style="margin-left:6px">{{cartCount}} in cart</span>
    </div>
  </header>

  <sc-if value="{{showNotifs}}" hint-placeholder-val="{{ false }}">
  <button type="button" aria-label="Close notifications" onClick="{{closeNotifs}}" style="position:fixed;inset:0;z-index:39;width:100%;height:100%;background:transparent;cursor:default"></button>
  <div role="dialog" aria-label="Notifications" style="position:absolute;top:70px;right:48px;z-index:40;width:420px;max-width:calc(100% - 32px);max-height:560px;display:flex;flex-direction:column;background:#fff;border:1.5px solid var(--line);border-radius:24px;box-shadow:0 20px 48px rgba(15,74,69,.2)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 10px;flex:none">
      <h2 style="font-size:22px">Notifications</h2>
      <sc-if value="{{canMarkAll}}" hint-placeholder-val="{{ true }}">
        <button type="button" class="link" style="min-height:44px;padding:0 4px;font-size:14px" onClick="{{markAll}}">Mark all as read</button>
      </sc-if>
    </div>
    <div style="overflow-y:auto;padding:4px 14px 16px;display:flex;flex-direction:column;gap:8px">
      <sc-if value="{{noNotifs}}" hint-placeholder-val="{{ false }}">
        <div style="padding:20px 8px;font-weight:600;color:var(--muted);line-height:1.45">No notifications yet. Order updates and rating requests will show up here.</div>
      </sc-if>
      <sc-for list="{{notifs}}" as="n" hint-placeholder-count="3">
        <button type="button" class="card nitem {{n.cls}}" onClick="{{n.open}}">
          <span class="tile t0" style="width:40px;height:40px;border-radius:12px;flex:none">
            <sc-if value="{{n.isFb}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A766E" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></sc-if>
            <sc-if value="{{n.isSt}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></sc-if>
          </span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-weight:800;font-size:15px;line-height:1.25">{{n.title}}</span>
            <span style="font-weight:600;font-size:13.5px;color:var(--muted);line-height:1.35">{{n.msg}}</span>
            <span style="font-weight:700;font-size:12.5px;color:var(--muted);margin-top:2px">{{n.meta}}</span>
          </span>
          <sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width:10px;height:10px;border-radius:50%;background:var(--pink);flex:none;margin-top:6px"></span><span class="sr">Unread</span></sc-if>
        </button>
      </sc-for>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{showPush}}" hint-placeholder-val="{{ false }}">
  <button type="button" onClick="{{openPush}}" style="position:fixed;top:16px;right:24px;z-index:60;width:360px;max-width:calc(100% - 32px);background:#fff;border-radius:20px;border:1.5px solid var(--line);box-shadow:0 10px 28px rgba(15,74,69,.22);padding:12px 14px;display:flex;gap:12px;align-items:center">
    <span class="tile t0" style="width:40px;height:40px;border-radius:12px;flex:none;font-family:Fredoka;font-weight:600;color:var(--pink)">HC</span>
    <span style="min-width:0;display:flex;flex-direction:column">
      <span style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted)"><span>Happy Creamy</span><span>now</span></span>
      <span style="font-weight:800;font-size:15px">{{push.title}}</span>
      <span style="font-weight:600;font-size:13.5px;color:var(--muted)">{{push.msg}}</span>
    </span>
  </button>
  </sc-if>
 
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ false }}">
  <section style="padding:28px 48px 0">
    <div style="border-radius:32px;background:linear-gradient(120deg,#A9E4DA,#8DCFE3);color:#0F3A36;padding:36px 44px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px">
      <div style="max-width:520px;display:flex;flex-direction:column;gap:10px">
        <span class="bd bdnew" style="align-self:flex-start">New arrivals</span>
        <h1 style="font-size:44px;line-height:1.05">Coconut Pandan has landed.</h1>
        <p style="margin:0;font-weight:700;font-size:17px">Creamy coconut with a ribbon of pandan. Delivered within 10 km, or ready at your nearest shop.</p>
      </div>
      <svg viewBox="0 0 80 80" width="170" height="170" aria-hidden="true">
        <circle cx="40" cy="30" r="17" fill="#8ED1B0"/><circle cx="34" cy="26" r="3.5" fill="#fff" opacity=".7"/>
        <path d="M25 41 L55 41 L40 77 Z" fill="#E9B56F" stroke="#0F3A36" stroke-width="2"/>
      </svg>
    </div>
  </section>
  <section style="padding:40px 48px 72px;display:flex;flex-direction:column;align-items:center;gap:36px">
    <h2 style="font-size:32px;text-align:center">Quick picks</h2>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:40px">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
        <button type="button" onClick="{{q.pick}}" style="display:flex;flex-direction:column;align-items:center;gap:14px;min-height:44px;text-align:center;width:180px">

          <div style="display:flex;flex-direction:column;gap:6px;flex:1 1 180px"><label for="adname" style="font-weight:800;font-size:14px">Name</label><input id="adname" class="field" placeholder="Office" value="{{adName}}" onChange="{{setAdName}}"></div>

          <div style="display:flex;flex-direction:column;gap:6px;flex:1 1 180px"><label for="npw2" style="font-weight:800;font-size:14px">New password</label><input id="npw2" class="field" type="password" placeholder="At least 8 characters" value="{{npw2}}" onChange="{{setNpw2}}"></div>

  <sc-if value="{{isMenu}}" hint-placeholder-val="{{ true }}">
  <main style="padding:32px 48px 56px;display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">

            <div style="font-weight:600;font-size:13px;color:var(--muted);line-height:1.35;min-height:35px">{{p.desc}}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">

              <button type="button" class="btn sm" aria-label="{{p.aria}}" onClick="{{p.add}}">Add</button>
            </div>
          </div>
        </sc-for>
      </div>
    </section>

    <aside aria-label="Your order" class="card" style="flex:1 1 340px;max-width:420px;min-width:0;padding:22px;display:flex;flex-direction:column;gap:16px;background:#fff;box-shadow:0 16px 32px rgba(26,118,110,.08)">

            <button type="button" class="row-opt {{a.cls}}" onClick="{{a.pick}}">
              <span class="radio"></span>
              <span style="flex:1;min-width:0">{{a.name}} <small style="font-weight:600;color:var(--muted)">· {{a.line}}</small></span>
              <span style="font-size:12.5px;color:var(--muted);font-weight:800">{{a.km}} km</span>

      <sc-if value="{{isPickup}}" hint-placeholder-val="{{ false }}">

        cls: n <= fb.rating ? 'on' : '', aria: n + (n === 1 ? ' star' : ' stars') + ': ' + STAR_LABELS[n - 1],
        pick: () => {
          const keep = {};
          optionsFor(n, fb.type).forEach((o) => { if (fb.opts[o.id]) keep[o.id] = true; });
          this.patchFb({ rating: n, opts: keep });
        }
      })),
      ratingLabel: fb.rating ? STAR_LABELS[fb.rating - 1] : 'Tap a star to rate', noRating: fb.rating === 0,
      hasOptions: fbOpts.length > 0,
      fbOpts: fbOpts.map((o) => ({ label: o.label, cls: fb.opts[o.id] ? 'on' : '', pick: () => this.patchFb({ opts: { ...fb.opts, [o.id]: !fb.opts[o.id] } }) })),
      comment: fb.comment, commentCount: fb.comment.length, setComment: (e) => this.patchFb({ comment: e.target.value.slice(0, 500) }),
      photos: fb.photos.map((ph) => ({
        cls: 'ph' + (ph.n % 3), label: 'Photo ' + ph.n, aria: 'Remove photo ' + ph.n,
        remove: () => this.patchFb({ photos: fb.photos.filter((x) => x.n !== ph.n), err: '' })
      })),
      photoCount: fb.photos.length, hasPhotoErr: !!fb.err, photoErr: fb.err,
      addPhoto: () => {
        if (fb.photos.length >= 3) this.patchFb({ err: 'You can add up to 3 photos.' });
        else this.patchFb({ photos: [...fb.photos, { n: fb.pn + 1 }], pn: fb.pn + 1, err: '' });
      },
      addBigPhoto: () => this.patchFb({ err: 'This photo is larger than 5 MB. Choose a smaller one.' }),
      closeFeedback: () => this.setState({ fb: null }),
      sendFeedback: () => { if (fb.rating) this.setState({ sent: { ...s.sent, [fb.id]: true }, fb: null, notice: 'Thanks! Your feedback has been sent.' }); },
      settings: [{ label: 'Profile', value: 'Nhung Nguyen' }],
      cartCount: s.cart.reduce((n, l) => n + l.qty, 0), cats, products, lines,
      cartEmpty: s.cart.length === 0,
      showNew: () => this.setState({ tab: 'menu', cat: 'new' }),
      deliveryCls: del ? 'on' : '', pickupCls: del ? '' : 'on',
      setDelivery: set({ orderType: 'delivery' }), setPickup: set({ orderType: 'pickup' }),
      isDelivery: del, isPickup: !del,
      addrs: s.addrList.map((a) => ({ ...a, cls: s.addr === a.id ? 'on' : '', pick: set({ addr: a.id }) })),
      slots: slotAvail.map((t) => ({ label: t, cls: slotSel === t ? 'on' : '', pick: set({ slot: t }) })),
      itemsLabel: fmt(items), packLabel: fmt(pack), feeLabel: fmt(fee), totalLabel: fmt(total),
      sumLine: fmt(items) + ' + ' + fmt(pack) + ' + ' + fmt(fee) + ' = ' + fmt(total),
      hasBlock: !!block, blockMsg: block, blocked,
      checkoutLabel: blocked && block ? 'Can’t place this order yet' : 'Checkout · ' + fmt(total),
      checkout: () => {
        if (blocked) return;
        const o = { id: 'HC-' + s.oid, type: s.orderType, total: fmt(total), count: s.cart.reduce((n, l) => n + l.qty, 0), step: 0 };
        this.notify({ ordered: true, cart: [], ord: o, oid: s.oid + 1 }, statusNotif(0, o));
      },
      ordered: s.ordered
    };
  }
}
 
return Component;
})();
mountDC(Component, document.getElementById('tpl').textContent, document.getElementById('root'));
</script>
